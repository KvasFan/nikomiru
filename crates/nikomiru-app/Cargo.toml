[package]
name = "nikomiru-app"
description = "Nikomiru: video player for language learning with subtitles, dictionaries and Anki"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[[bin]]
name = "nikomiru"
path = "src/main.rs"

# L6 (TEST §2): the real binary driven by the GUI test harness.
[[test]]
name = "e2e"
path = "../../tests/e2e/main.rs"
required-features = ["test-harness"]

[features]
# GUI test harness (TEST §2.1): never in release builds (T-SEC-004).
test-harness = ["nikomiru-ui/test-harness"]

[dependencies]
nikomiru-core.workspace = true
nikomiru-dict.workspace = true
nikomiru-library.workspace = true
nikomiru-media.workspace = true
nikomiru-player.workspace = true
nikomiru-subs.workspace = true
nikomiru-ui.workspace = true
egui.workspace = true
egui-winit.workspace = true
egui_glow.workspace = true
glow.workspace = true
glutin.workspace = true
glutin-winit.workspace = true
winit.workspace = true
raw-window-handle.workspace = true
wayland-client.workspace = true
wayland-backend.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-appender.workspace = true
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
# the L6 tests write a large dictionary for an import to interrupt
zip.workspace = true
wayland-protocols-wlr.workspace = true
wayland-protocols-plasma.workspace = true
