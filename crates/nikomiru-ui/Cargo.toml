[package]
name = "nikomiru-ui"
description = "The interface (egui): player page, subtitle overlay, dictionary popup, dictionaries page and controls"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[features]
# GUI test harness (TEST §2.1), enabled by nikomiru-app's `test-harness`: never in
# release builds (T-SEC-004).
test-harness = ["nikomiru-player/test-support"]

[dependencies]
nikomiru-core.workspace = true
nikomiru-dict.workspace = true
nikomiru-text.workspace = true
nikomiru-library.workspace = true
nikomiru-player.workspace = true
nikomiru-media.workspace = true
nikomiru-subs.workspace = true
egui.workspace = true
egui_system_font_provider.workspace = true
fontique.workspace = true
image.workspace = true
fluent-bundle.workspace = true
unic-langid.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true

[dev-dependencies]
egui_kittest.workspace = true
tempfile.workspace = true
proptest.workspace = true
nikomiru-dict = { workspace = true, features = ["test-support"] }
# the T-SEC-001 tests zip the mini-ja source folder for the real importer
zip.workspace = true

[lints]
workspace = true
